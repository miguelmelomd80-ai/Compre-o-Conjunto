<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lojas — Compre o Conjunto</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e4e4df; --ok:#067647; --warn:#9a6700; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 24px; background:var(--card); border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; }
  header small { color:var(--muted); }
  main { max-width:980px; margin:0 auto; padding:24px 16px 64px; }
  .btn { display:inline-flex; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit; font-size:14px; text-decoration:none; cursor:pointer; }
  .btn.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px; }
  .card h2 { font-size:16px; margin:0; }
  .muted { color:var(--muted); font-size:13px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:99px; background:#ecfdf3; color:var(--ok); }
  .badge.warn { background:#fff8e6; color:var(--warn); }
  .card .btn { margin-top:8px; justify-content:center; }
  .empty { text-align:center; padding:48px 16px; color:var(--muted); }
  @media (max-width:640px) { header { padding:12px 16px; } }
</style>
</head>
<body>
<header>
  <div><h1>Compre o Conjunto</h1><small>Painel da agência</small></div>
  <a class="btn" href="/logout">Sair</a>
</header>
<main>
  <p class="muted" style="margin-top:0">Lojas que instalaram o app. Escolha uma para gerenciar os conjuntos.</p>
  <div class="grid" id="list"><p class="muted">Carregando…</p></div>
</main>
<script>
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); };
  (async function () {
    var r = await fetch('/api/agency/stores', { credentials: 'include' });
    if (r.status === 401) { location.href = '/login'; return; }
    var stores = await r.json();
    var el = document.getElementById('list');
    if (!stores.length) { el.innerHTML = '<div class="card empty" style="grid-column:1/-1">Nenhuma loja instalou o app ainda.</div>'; return; }
    el.innerHTML = stores.map(function (s) {
      return '<div class="card"><h2>' + esc(s.name || 'Loja #' + s.store_id) + '</h2>' +
        '<div class="muted">' + esc((s.domain || '').replace(/^https?:\/\//, '') || ('#' + s.store_id)) + '</div>' +
        '<div><span class="badge">' + s.active_sets + ' conjunto(s) ativo(s)</span> ' +
        (s.coupons ? '' : '<span class="badge warn" title="Reautorize o app para liberar descontos">sem permissão de cupons</span>') + '</div>' +
        '<button class="btn primary" data-id="' + esc(s.store_id) + '">Gerenciar</button></div>';
    }).join('');
    el.onclick = async function (e) {
      var b = e.target.closest('button[data-id]'); if (!b) return;
      b.disabled = true;
      await fetch('/api/agency/select', { method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ store_id: b.dataset.id }) });
      location.href = '/admin';
    };
  })();
</script>
</body>
</html>
