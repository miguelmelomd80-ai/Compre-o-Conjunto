<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Compre o Conjunto</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --line:#e4e4df; --danger:#b42318; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { width:100%; max-width:400px; }
  .brand { text-align:center; margin-bottom:20px; }
  .brand h1 { font-size:22px; margin:0 0 4px; }
  .brand p { margin:0; color:var(--muted); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px; }
  label { display:block; font-weight:600; font-size:13px; margin:14px 0 6px; }
  input { width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px; font:inherit; }
  input:focus { outline:2px solid var(--ink); outline-offset:1px; }
  .btn { display:block; width:100%; margin-top:18px; padding:12px; border:0; border-radius:8px; background:var(--ink); color:#fff;
    font:600 15px system-ui; cursor:pointer; text-align:center; text-decoration:none; }
  .btn.ghost { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn:disabled { opacity:.6; }
  .err { color:var(--danger); font-size:13px; min-height:1.2em; margin-top:10px; }
  .sep { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; margin:20px 0 4px; }
  .sep::before, .sep::after { content:""; flex:1; height:1px; background:var(--line); }
  .muted { color:var(--muted); font-size:13px; margin:10px 0 0; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <h1>Compre o Conjunto</h1>
    <p>Venda o look completo na sua loja Nuvemshop</p>
  </div>
  <div class="card">
    <form id="f" hidden>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn" type="submit" id="go">Entrar</button>
      <div class="err" id="err" role="alert"></div>
      <div class="sep">ou</div>
    </form>
    <a class="btn ghost" href="__INSTALL_URL__">Sou lojista — entrar pela Nuvemshop</a>
    <p class="muted">Lojistas também podem abrir o app direto em <b>Meus aplicativos</b>, no admin da Nuvemshop.</p>
  </div>
</div>
<script>
  var AGENCY = __AGENCY_ENABLED__;
  var f = document.getElementById('f');
  if (AGENCY) f.hidden = false;
  f.onsubmit = async function (e) {
    e.preventDefault();
    var btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; err.textContent = '';
    try {
      var r = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include',
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error(d.error || 'Não foi possível entrar.');
      location.href = d.redirect || '/lojas';
    } catch (x) { err.textContent = x.message; btn.disabled = false; }
  };
</script>
</body>
</html>
